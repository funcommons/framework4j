name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'skills/**'
      - 'scripts/build-docs.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - 'framework4j-*/README.md'
      - 'framework4j-*/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 同步内容源（模块 README → docs/modules/，skills/framework4j → docs/skills/）
      # 并以 Pages 子路径编译；--skip-demo 不写 demo 静态资源
      - run: node scripts/build-docs.mjs --base=/framework4j/ --skip-demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
