spring:
  application:
    name: cache-integration-test
  redis:
    host: localhost
    port: 6379
    timeout: 3000
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2
      max-wait: 3000ms

framework4j:
  redis:
    enabled: true
    datasources:
      default:
        host: localhost
        port: 6379
        database: 0
        timeout: 3000
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
            max-wait: 3000
        redisson:
          enabled: false

  cache:
    enabled: true
    redis-name: default
    default-ttl-seconds: 60
    null-ttl-seconds: 10
    key-prefix: "cache"
    l1:
      enabled: true
      max-size: 1000
      expire-after-write: 30
    single-flight:
      enabled: true
      lock-ttl-seconds: 3
      wait-millis: 50
      max-retry: 20
