spring:
  application:
    name: id-sdk-pgsql-test
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springdoc.webmvc.ui.SwaggerConfig
      - org.springdoc.webmvc.core.SwaggerWebMvcConfiguration

# 使用 ldx2t.commons.datasource 模块注入数据源
ldx2t:
  commons:
    # 多数据源配置
    datasource:
      enabled: true
      datasources:
        test:
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
          username: sa
          password:
          driver-class-name: org.h2.Driver
          druid:
            initial-size: 2
            min-idle: 2
            max-active: 10
            max-wait: 60000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
          mybatis-plus:
            mapper-locations: classpath*:/mapper/**/*.xml
            type-aliases-package: com.ldx2t.commons.id.integration
            configuration:
              log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

    # ID SDK 配置 (IP 策略，测试无 Redis 环境)
    id:
      enabled: true
      worker:
        strategy: ip
      mybatis:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.ldx2t: DEBUG
    org.springframework.jdbc: DEBUG
    com.alibaba.druid: INFO
