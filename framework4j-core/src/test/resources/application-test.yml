spring:
  application:
    name: id-sdk-test
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # Jackson 配置为北京时间格式
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# ID SDK 配置 (IP Hash 策略，无 Redis 依赖)
ldx2t:
  commons:
    id:
      enabled: true
      worker:
        strategy: ip
      mybatis:
        enabled: false
    openid:
      fastjson2:
        enabled: true
logging:
  level:
    com.ldx2t: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false


# JVM 时区设置
jvm:
  arguments: "-Duser.timezone=Asia/Shanghai"