spring:
  application:
    name: framework4j-demo
  web:
    resources:
      static-locations: classpath:/static/
  redis:
    host: localhost
    port: 6379
  lettuce:
    pool:
      max-active: 8
  # H2 内存数据库（demo 用）
  datasource:
    url: jdbc:h2:mem:demo
    driver-class-name: org.h2.Driver
    username: sa
    password:

framework4j:
  redis:
    enabled: true
    datasources:
      default:
        host: localhost
        port: 6379
        database: 0

  access-token:
    enabled: true
    redis-name: default
    secret-key: demo-secret-key-for-jwt-signing-must-be-at-least-32-chars
    hash-salt: demo-hash-salt
    expire-time: 7200
    policies:
      WEB:
        key: [uid]
        expire-time: 7200
        max-usage: -1
        auto-renew: true
        renew-increment: 1800

  signature:
    enabled: true
    redis-name: default
    path-patterns: ["/v1/api/**"]

  rate-limit:
    enabled: true
    redis-name: default
    default-limit: 10
    default-window: "1m"
    path-patterns: ["/v1/**"]

  cache:
    enabled: true
    redis-name: default
    default-ttl-seconds: 300

  audit:
    enabled: true
    hash-chain-enabled: true

  sensitive:
    enabled: true
    encryption-key: demo-aes-key-change-in-production!!

  # ============ v2.3.0 动态追踪日志 ============
  tracelog:
    enabled: true
    redis-name: default
    storage:
      key-prefix: trace_log
      global-max-traces: 10000     # demo 调小
      trace-ttl-seconds: 3600      # demo 1h
    collection:
      worker-count: 2
      flush-batch-size: 100
      flush-interval-ms: 200
      rate-limit-per-trace-per-second: 100
      fallback-dir: /tmp/framework4j-tracelog-fallback
    switch:
      channel: channel:log_switch
      transport: pubsub
      resync-interval-seconds: 5
    elevation:
      allowed-packages:
        - fun.commons.framework4j.demo
      default-level: DEBUG
    api:
      require-auth: false         # demo 简化关闭鉴权
      max-return-logs: 500
    console:
      enabled: true
      path: /tracelog.html
