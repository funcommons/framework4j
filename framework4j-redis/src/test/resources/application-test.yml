spring:
  application:
    name: framework4j-test
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

framework4j:
  redis:
    enabled: true
    datasources:
      default:
        host: localhost
        port: 6379
        database: 0
        timeout: 3000
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2
        redisson:
          enabled: false

      cache:
        aliases: [temp]
        host: localhost
        port: 6379
        database: 1
        lettuce:
          pool:
            max-active: 16
            max-idle: 8
            min-idle: 4
        redisson:
          enabled: true

      business:
        host: localhost
        port: 6379
        database: 2
        lettuce:
          pool:
            max-active: 16
            max-idle: 8
            min-idle: 4
        redisson:
          enabled: true

      lock:
        host: localhost
        port: 6379
        database: 3
        redisson:
          enabled: true
